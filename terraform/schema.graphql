schema {
    query: Query
    mutation: Mutation
}

# -------------------------------
# Queries
# -------------------------------
type Query {
    runForecastTest(input: ForecastInput): GenericResponse!

    getSKUsMetadata: GenericResponse!

    getReportSummary: GenericResponse!

    getSKUForecasts: GenericResponse!

    getMonthlyTotals: GenericResponse!

    getDailyForecasts: GenericResponse!

    getForecastRun(runId: ID!): ForecastRun

    listForecastRuns(limit: Int, nextToken: String): ForecastRunConnection!

    listNotifications(limit: Int, nextToken: String): NotificationConnection!

    getSkuForecastValues: GenericResponse!

    getReplenishmentSignals: GenericResponse!

    getTenantSettings: TenantSettings
}

type Mutation {
    startForecastRun(input: StartForecastInput!): ForecastRunResponse!

    markNotificationRead(notificationId: ID!): Notification

    setTenantSettings(input: TenantSettingsInput!): TenantSettings
}

# -------------------------------
# Generic Lambda response
# -------------------------------
type GenericResponse {
    status: String!
    result: AWSJSON
}

type ForecastRunResponse {
    status: String!
    run: ForecastRun
    message: String
}

type ForecastRun {
    runId: ID!
    tenantId: ID!
    snapshotId: ID
    status: String!
    createdAt: AWSDateTime
    updatedAt: AWSDateTime
    s3OutputPrefix: String
    summary: AWSJSON
}

type ForecastRunConnection {
    items: [ForecastRun!]!
    nextToken: String
}

type Notification {
    notificationId: ID!
    runId: ID!
    tenantId: ID!
    status: String!
    createdAt: AWSDateTime
    updatedAt: AWSDateTime
    read: Boolean!
    summary: AWSJSON
}

type NotificationConnection {
    items: [Notification!]!
    nextToken: String
}

type TenantSettings {
    tenantId: ID!
    model: String
    mode: String
    seasonality: String
    updatedAt: AWSDateTime
}

input TenantSettingsInput {
    model: String
    mode: String
    seasonality: String
}

# -------------------------------
# Input types
# -------------------------------
input ForecastInput {
    input_data: AWSJSON
}

input StartForecastInput {
    s3Bucket: String!
    s3Key: String!
    originalFilename: String
    adjustmentsKey: String
    sku: String
    store: String
    frequency: String
}
