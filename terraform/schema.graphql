schema {
    query: Query
    mutation: Mutation
    subscription: Subscription
}

# -------------------------------
# Queries
# -------------------------------
type Query {
    runForecastTest(input: ForecastInput): GenericResponse!

    getSKUsMetadata(runId: ID): GenericResponse!

    getReportSummary(runId: ID): GenericResponse!

    getSKUForecasts(runId: ID): GenericResponse!

    getMonthlyTotals(runId: ID): GenericResponse!

    getDailyForecasts(runId: ID): GenericResponse!

    getForecastRun(runId: ID!): ForecastRun

    listForecastRuns(limit: Int, nextToken: String): ForecastRunConnection!

    listNotifications(limit: Int, nextToken: String): NotificationConnection!

    getSkuForecastValues(runId: ID): GenericResponse!
    getMergedSkuForecastValues(runId: ID): GenericResponse!

    getReplenishmentSignals(runId: ID): GenericResponse!

    getTenantSettings: TenantSettings
    getForecastApprovals: GenericResponse!

    forecastAssistant(input: ForecastAssistantInput!): ForecastAssistantResponse!

    getAssistantUsage: AssistantUsage!
}

type Mutation {
    startForecastRun(input: StartForecastInput!): ForecastRunResponse!

    markNotificationRead(notificationId: ID!): Notification
    markAllNotificationsRead: NotificationActionResult!
    clearCompletedNotifications: NotificationActionResult!

    setTenantSettings(input: TenantSettingsInput!): TenantSettings
    setForecastApproval(input: ForecastApprovalInput!): GenericResponse!

    updateForecastRunStatus(input: UpdateForecastRunStatusInput!): ForecastRun @aws_api_key
}

type Subscription {
    onForecastRunUpdated(tenantId: ID!): ForecastRun
    @aws_subscribe(mutations: ["updateForecastRunStatus"])
}

# -------------------------------
# Generic Lambda response
# -------------------------------
type GenericResponse {
    status: String!
    result: AWSJSON
}

type ForecastRunResponse {
    status: String!
    run: ForecastRun
    message: String
    result: AWSJSON
}

type ForecastRun {
    runId: ID!
    tenantId: ID!
    snapshotId: ID
    parentRunId: ID
    isScenario: Boolean
    adjustmentsKey: String
    scenarioLabel: String
    editedAt: AWSDateTime
    editedCellCount: Int
    status: String!
    createdAt: AWSDateTime
    updatedAt: AWSDateTime
    s3OutputPrefix: String
    summary: AWSJSON
}

type ForecastRunConnection {
    items: [ForecastRun!]!
    nextToken: String
}

type Notification {
    notificationId: ID!
    runId: ID!
    tenantId: ID!
    status: String!
    createdAt: AWSDateTime
    updatedAt: AWSDateTime
    read: Boolean!
    summary: AWSJSON
}

type NotificationConnection {
    items: [Notification!]!
    nextToken: String
}

type NotificationActionResult {
    affectedCount: Int!
}

type TenantSettings {
    tenantId: ID!
    model: String
    mode: String
    seasonality: String
    dateFormat: String
    skuColumnName: String
    storeColumnName: String
    targetVariable: String
    onHandColumnName: String
    priceColumnName: String
    holidayColumnName: String
    promotionColumnName: String
    openStatusColumnName: String
    forecastHorizon: Int
    updatedAt: AWSDateTime
}

input TenantSettingsInput {
    model: String
    mode: String
    seasonality: String
    dateFormat: String
    skuColumnName: String
    storeColumnName: String
    targetVariable: String
    onHandColumnName: String
    priceColumnName: String
    holidayColumnName: String
    promotionColumnName: String
    openStatusColumnName: String
    forecastHorizon: Int
}

input ForecastApprovalInput {
    sku: String!
    store: String
    approved: Boolean!
}

# -------------------------------
# Input types
# -------------------------------
input ForecastInput {
    input_data: AWSJSON
}

input StartForecastInput {
    s3Bucket: String!
    s3Key: String!
    originalFilename: String
    adjustmentsKey: String
    parentRunId: ID
    scenarioLabel: String
    editedCellCount: Int
    sku: String
    store: String
    frequency: String
    model: String
    mode: String
    seasonality: String
    dateFormat: String
    skuColumnName: String
    storeColumnName: String
    targetVariable: String
    onHandColumnName: String
    priceColumnName: String
    holidayColumnName: String
    promotionColumnName: String
    openStatusColumnName: String
    forecastHorizon: Int
    futureAssumptionsJson: AWSJSON
}

input UpdateForecastRunStatusInput {
    tenantId: ID!
    runId: ID!
    status: String!
    s3OutputPrefix: String
    summaryJson: String
}

input ForecastAssistantInput {
    command: String!
    runId: ID
    contextMode: String
    pageId: String
    route: String
    selectedSku: String
    selectedStore: String
}

type ForecastAssistantAction {
    id: ID!
    label: String!
    route: String
    kind: String!
}

type ForecastAssistantStep {
    id: ID!
    title: String!
    description: String!
    status: String!
    action: ForecastAssistantAction
}

type AssistantEvidence {
    source: String!
    title: String!
    detail: String!
}

type ForecastAssistantResponse {
    status: String!
    intent: String!
    assistantText: String!
    context: AWSJSON
    checklist: [String!]!
    suggestedPrompts: [String!]!
    steps: [ForecastAssistantStep!]!
    confidence: Float
    evidence: [AssistantEvidence!]!
    warnings: [String!]!
    usedTools: [String!]!
    answerVersion: String!
}

type AssistantUsage {
    monthKey: String!
    requestsUsed: Int!
    requestsLimit: Int!
    tokensUsed: Int!
    tokensLimit: Int!
    rateMinuteLimit: Int!
    rateHourLimit: Int!
}
